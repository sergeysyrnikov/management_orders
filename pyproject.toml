[project]
name = "management-orders"
version = "0.1.0"
description = "Management orders service API"
authors = [
    { name = "Sergey", email = "sergeysyrnikov91@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.3",
    "black>=26.1.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "psycopg>=3.3.2",
    "psycopg2>=2.9.11",
    "pydantic-settings>=2.12.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "ruff>=0.15.0",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
]
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
[tool.poetry.group.dev.dependencies]